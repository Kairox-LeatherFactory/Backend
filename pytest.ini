[pytest]
asyncio_mode = auto
testpaths = tests

# The suite is layered by DIRECTORY, so a layer runs by path with no marker
# needed. The markers below exist so a layer can also be selected ACROSS
# directories (`-m money`) — useful when the money paths must be verified in
# isolation before a release.
#
#   pytest tests/unit          fast, no DB          (~1s)
#   pytest tests/integration   service -> repo -> DB on aiosqlite
#   pytest tests/functional    one capability end to end
#   pytest tests/system        router -> service -> repo via httpx
#   pytest tests/              everything
#   pytest -m money            the wage paths, wherever they live
#
# tests/uat holds human checklists in markdown, not code — nothing to collect.
markers =
    money: payroll, rates and anything that decides what a person is paid
    integrity: constraints, gates and state machines that protect data
    security: authorization, tenancy and role boundaries
    slow: takes more than a second

# Show why a test was skipped or xfailed. This matters here: several tests are
# xfail'd against specific audit findings, and a silent xfail hides the fact that
# a known blocker is still open. `xfail_strict` is deliberately NOT set — those
# tests should flip to XPASS (visible, non-failing) the moment a fix lands.
addopts = -ra

filterwarnings =
    ignore::DeprecationWarning:starlette.*
    ignore:.*HTTP_422_UNPROCESSABLE_ENTITY.*:DeprecationWarning
