[alembic]
script_location = alembic
sqlalchemy.url = postgresql://factory:factory@localhost:5432/factory
# Descriptive, time-sortable revision filenames (spec §3) — replaces the ad-hoc
# slugs (_2nd / _baseline12 / _new_changes). New revisions get e.g.
# 20260611_1432_add_procurement_tables.py. Pass a clear --message slug per revision.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
qualname =
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
