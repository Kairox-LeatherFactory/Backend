# =============================================================================
# config/pom_dictionary.yaml — term → standard POM code (Stage 2 §1b/§3a)
# =============================================================================
# Seeded idempotently into the `pom_dictionary` table by scripts/seed.py. POM
# extraction (§1) standardizes EVERY client/native term to a stable `pom_code`;
# an unmapped term is surfaced for a one-click "map this term", NEVER dropped or
# guessed into an existing code. Adding a client's Italian / Japanese synonym is
# ONE entry here + a re-seed — no source change (acceptance §11.6).
#
# Per entry:
#   language      ja / it / en  (matches client_template.language)
#   source_term   the ORIGINAL label as it appears on the sheet (渡り幅, inseam)
#   pom_code      the standardized code everything downstream joins on
#   garment_type  optional scoping (a term can mean different POMs per type)
#   weight        tie-break when two terms collide
# =============================================================================

