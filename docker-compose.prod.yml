# PRODUCTION overlay — server, port 8000, migrations ON, seed OFF (NEVER seed prod).
#   docker compose -p kairox-prod -f docker-compose.yml -f docker-compose.prod.yml \
#     --env-file .env.prod up -d --build
#
# Redis is NOT bundled here — .env.prod must set CELERY_BROKER_URL and
# CELERY_RESULT_BACKEND at your Upstash / Redis Cloud instance (rediss:// for TLS),
# configured with maxmemory-policy=noeviction.
#
# SCALING NOTE: `docker compose up -d --scale worker=N` is safe — the breakdown
# claim is an atomic COMPLETE->CONSUMED compare-and-set, so two workers can never
# process the same submission. NEVER scale `beat`: each replica is its own
# scheduler, so every periodic job would fire once per replica.
services:
  api:
    environment:
      # SAFE TODAY BECAUSE THERE IS EXACTLY ONE API CONTAINER.
      #
      # With `true`, every api container runs `alembic upgrade head` at start.
      # One container, one migration, no problem. The MOMENT you run a second
      # replica they race: two processes apply the same revision against the
      # same database, and the loser either errors or half-applies.
      #
      # BEFORE YOU SCALE OUT, do this instead:
      #
      #     # 1. migrate once, on its own, and let it finish
      #     docker compose -p kairox-prod -f docker-compose.yml       #       -f docker-compose.prod.yml --env-file .env.prod run --rm api migrate
      #
      #     # 2. then start/replace the api containers with migrations OFF
      #     RUN_MIGRATIONS=false docker compose ... up -d --build
      #
      # The `migrate` command already exists in entrypoint.sh — it waits for
      # Postgres, runs the upgrade, and exits. Nothing new is needed; the change
      # is running it as a STEP rather than as a side effect of booting.
      RUN_MIGRATIONS: "true"
      RUN_SEED: "false"         # real data — never auto-seed
    ports:
      - "8000:8000"
  worker:
    environment:
      CELERY_AUTORELOAD: "false"
      CELERY_CONCURRENCY: "${CELERY_CONCURRENCY:-4}"
      CELERY_LOGLEVEL: "${CELERY_LOGLEVEL:-info}"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2400M
  beat:
    environment:
      CELERY_AUTORELOAD: "false"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
