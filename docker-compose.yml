# ──────────────────────────────────────────────────────────────
# Leather Factory backend — docker-compose.yml  (BASE / shared)
# ──────────────────────────────────────────────────────────────
# ONE base file, combined with a small per-environment overlay.
#
#   DEV (laptop — bundled Postgres + Redis + hot-reload):
#     docker compose -f docker-compose.yml -f docker-compose.dev.yml \
#       --profile dev up --build
#
#   STAGING (server — Supabase-staging + Upstash-staging):
#     docker compose -p kairox-staging \
#       -f docker-compose.yml -f docker-compose.staging.yml \
#       --env-file .env.staging up -d --build
#
#   PRODUCTION (server — later — Supabase-prod + Upstash-prod):
#     docker compose -p kairox-prod \
#       -f docker-compose.yml -f docker-compose.prod.yml \
#       --env-file .env.prod up -d --build
#
# `-p <name>` labels every container/volume so two stacks never collide on one EC2.
# Bundled db/redis are behind the `dev` profile => they only start on the laptop,
# never on the server (server uses Supabase + Upstash).
#
# Each service runs GUNICORN internally (api) / celery (worker,beat) via
# entrypoint.sh — so you do NOT write a systemd gunicorn.service in Docker.
# Docker keeps them alive via `restart: unless-stopped`. Nginx is still the
# public front door.
#
# ── WHY THE WORKER IS NOT OPTIONAL ──────────────────────────────────────────
# The whole bom module runs through Celery: build_order_breakdown_for_submission
# (Gemini extraction, 30-200s), parse_pattern_dxf (ezdxf), generate_bom, plus two
# beat jobs (freight-risk scan every 2h, notification escalation every 15m).
# POST .../order-breakdown returns 202 and enqueues — with no worker running, the
# API answers 202 forever and NOTHING is ever extracted. worker up == BOM works.
# ──────────────────────────────────────────────────────────────

# ── shared log-rotation, applied to every app container ──────────────────────
# Caps each container logs so they never fill the disk over weeks
# (max 3 files x 10MB = 30MB per container). Referenced by api/worker/beat below.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-app-base: &app-base
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  logging: *default-logging
  env_file:
    - path: .env
      required: false
  volumes:
    - procurement_docs:/app/var/procurement-documents

x-app-env: &app-env
  DATABASE_URL: "${DATABASE_URL:-postgresql+psycopg2://factory:factory@db:5432/factory}"
  ASYNC_DATABASE_URL: "${ASYNC_DATABASE_URL:-postgresql+asyncpg://factory:factory@db:5432/factory}"
  DEBUG: "${DEBUG:-false}"
  SECRET_KEY: "${SECRET_KEY:-dev-only-insecure-change-me-in-prod}"
  # Broker = where tasks queue. Backend = where results land. Two DBs on purpose
  # so a flushdb of results can never drop queued work.
  # Upstash / Redis Cloud: use the rediss:// (TLS) URL — same vars, no code change.
  CELERY_BROKER_URL: "${CELERY_BROKER_URL:-redis://redis:6379/0}"
  CELERY_RESULT_BACKEND: "${CELERY_RESULT_BACKEND:-redis://redis:6379/1}"
  # entrypoint.sh resolves these; beat app differs from the worker app ON PURPOSE
  # (app/core/beat_schedule.py is what registers conf.beat_schedule — pointing
  # beat at app.core.celery would give it an empty schedule). See entrypoint.sh.
  CELERY_APP: "${CELERY_APP:-app.core.celery:celery_app}"
  CELERY_BEAT_APP: "${CELERY_BEAT_APP:-app.core.beat_schedule:celery_app}"
  CELERY_BEAT_SCHEDULE_FILE: "/app/var/celerybeat/celerybeat-schedule"
  # Leave CELERY_QUEUES UNSET unless you also add task_routes/task_default_queue
  # in app/core/celery.py. Tasks currently publish to the default queue "celery";
  # a worker started with -Q anything-else consumes nothing while the API happily
  # keeps returning 202. entrypoint.sh only passes -Q when this is non-empty.
  CELERY_QUEUES: "${CELERY_QUEUES:-}"
  WEB_CONCURRENCY: "${WEB_CONCURRENCY:-4}"
  GUNICORN_TIMEOUT: "${GUNICORN_TIMEOUT:-120}"
  VIRUS_SCAN_ENABLED: "${VIRUS_SCAN_ENABLED:-false}"
  CLAMD_HOST: "${CLAMD_HOST:-clamav}"
  CLAMD_PORT: "3310"
  # On the server you use Supabase storage; default reflects that. Dev overrides
  # to `local` via .env / the dev overlay when needed.
  STORAGE_BACKEND: "${STORAGE_BACKEND:-supabase}"
  LOCAL_STORAGE_DIR: "/app/var/procurement-documents"
  MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-25}"

services:
  # ── LOCAL-DEV ONLY: bundled Postgres (profile: dev) ─────────────────────────
  db:
    image: postgres:16
    profiles: ["dev"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-factory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-factory}
      POSTGRES_DB: ${POSTGRES_DB:-factory}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-factory} -d ${POSTGRES_DB:-factory}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── LOCAL-DEV ONLY: bundled Redis (profile: dev) ────────────────────────────
  # This is the CELERY BROKER, not a cache. Two settings matter:
  #   --appendonly yes  : queued tasks survive a redis restart.
  #   --maxmemory-policy noeviction : a broker must NEVER evict. The default
  #     policy would silently drop queued BOM jobs under memory pressure, and the
  #     API would still have returned 202 for every one of them.
  # On the server this service does not run at all — CELERY_BROKER_URL points at
  # Upstash / Redis Cloud, which should be configured with noeviction too.
  redis:
    image: redis:7-alpine
    profiles: ["dev"]
    restart: unless-stopped
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--maxmemory-policy"
      - "noeviction"
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ── ClamAV virus scanner — OPT-IN (profile: scan) ───────────────────────────
  clamav:
    image: clamav/clamav:latest
    profiles: ["scan"]
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${CLAMD_HOST_PORT:-3310}:3310"
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ── Backend API — Gunicorn managing uvicorn workers ─────────────────────────
  api:
    <<: *app-base
    command: ["api"]
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
      RUN_SEED: "${RUN_SEED:-false}"     # OFF by default — seed is manual
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  # ── Celery worker — the BOM pipeline actually runs HERE ─────────────────────
  worker:
    <<: *app-base
    command: ["worker"]
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "false"
      RUN_SEED: "false"
      CELERY_CONCURRENCY: "${CELERY_CONCURRENCY:-4}"
      CELERY_LOGLEVEL: "${CELERY_LOGLEVEL:-info}"
      # ezdxf/shapely hold memory across a big DXF; recycle the child process.
      CELERY_MAX_TASKS_PER_CHILD: "${CELERY_MAX_TASKS_PER_CHILD:-100}"
    depends_on:
      api:
        condition: service_healthy
    # app/core/celery.py sets task_time_limit=300. Docker default 10s stop grace
    # would SIGKILL a running Gemini extraction; with acks_late the task is then
    # redelivered and the whole 200s call is paid twice. Give it room to finish.
    stop_grace_period: "${CELERY_STOP_GRACE:-310s}"
    healthcheck:
      # Ping THIS worker by name (--hostname is worker@%h => worker@<container id>).
      # A bare "inspect ping" answers for any worker on the broker, so a dead
      # container would look healthy as long as a sibling was alive.
      test: ["CMD-SHELL", "celery -A $${CELERY_APP} inspect ping -d worker@$$HOSTNAME --timeout 10 || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s

  # ── Celery beat — the scheduler (freight-risk scan, notification escalation) ─
  # EXACTLY ONE of these per stack. Two beats = every periodic task fires twice.
  beat:
    <<: *app-base
    command: ["beat"]
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "false"
      RUN_SEED: "false"
      CELERY_LOGLEVEL: "${CELERY_LOGLEVEL:-info}"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - procurement_docs:/app/var/procurement-documents
      # Persist "when did each entry last fire" so a restart does not replay them.
      - celerybeat:/app/var/celerybeat
    healthcheck:
      # beat has no "inspect ping" (it consumes nothing) — liveness is simply
      # "is the scheduler process still up". pgrep comes from procps (Dockerfile).
      test: ["CMD-SHELL", "pgrep -f '[c]elery.*beat' > /dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Flower — Celery monitoring UI (profile: monitor) ────────────────────────
  #   docker compose --profile monitor up -d flower   =>  http://localhost:5555
  # Shows queued/active/failed tasks and their tracebacks — the fastest way to
  # see WHY a build_order_breakdown_for_submission run produced style_count 0
  # without tailing worker logs. Requires flower in requirements.txt.
  # Do NOT expose this publicly without FLOWER_BASIC_AUTH — it can revoke tasks.
  flower:
    <<: *app-base
    profiles: ["monitor"]
    command: ["flower"]
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "false"
      RUN_SEED: "false"
      FLOWER_BASIC_AUTH: "${FLOWER_BASIC_AUTH:-}"
    ports:
      - "${FLOWER_HOST_PORT:-5555}:5555"

volumes:
  pgdata:
    name: ${COMPOSE_PROJECT_NAME:-factory}_pgdata
  redisdata:
    name: ${COMPOSE_PROJECT_NAME:-factory}_redis_data
  procurement_docs:
    name: ${COMPOSE_PROJECT_NAME:-factory}_procurement_docs
  celerybeat:
    name: ${COMPOSE_PROJECT_NAME:-factory}_celerybeat
