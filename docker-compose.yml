# ──────────────────────────────────────────────────────────────
# Leather Factory backend — docker-compose.yml  (BASE / shared)
# ──────────────────────────────────────────────────────────────
# ONE base file, combined with a small per-environment overlay.
#
#   DEV (laptop — bundled Postgres + Redis + hot-reload):
#     docker compose -f docker-compose.yml -f docker-compose.dev.yml \
#       --profile dev up --build
#
#   STAGING (server — Supabase-staging + Upstash-staging):
#     docker compose -p kairox-staging \
#       -f docker-compose.yml -f docker-compose.staging.yml \
#       --env-file .env.staging up -d --build
#
#   PRODUCTION (server — later — Supabase-prod + Upstash-prod):
#     docker compose -p kairox-prod \
#       -f docker-compose.yml -f docker-compose.prod.yml \
#       --env-file .env.prod up -d --build
#
# `-p <name>` labels every container/volume so two stacks never collide on one EC2.
# Bundled db/redis are behind the `dev` profile => they only start on the laptop,
# never on the server (server uses Supabase + Upstash).
#
# Each service runs GUNICORN internally (api) / celery (worker,beat) via
# entrypoint.sh — so you do NOT write a systemd gunicorn.service in Docker.
# Docker keeps them alive via `restart: unless-stopped`. Nginx is still the
# public front door.
# ──────────────────────────────────────────────────────────────

# ── shared log-rotation, applied to every app container ──────────────────────
# Caps each container's logs so they never fill the disk over weeks
# (max 3 files × 10MB = 30MB per container). Referenced by api/worker/beat below.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-app-base: &app-base
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  logging: *default-logging
  env_file:
    - path: .env
      required: false
  volumes:
    - procurement_docs:/app/var/procurement-documents

x-app-env: &app-env
  DATABASE_URL: "${DATABASE_URL:-postgresql+psycopg2://factory:factory@db:5432/factory}"
  ASYNC_DATABASE_URL: "${ASYNC_DATABASE_URL:-postgresql+asyncpg://factory:factory@db:5432/factory}"
  DEBUG: "${DEBUG:-false}"
  SECRET_KEY: "${SECRET_KEY:-dev-only-insecure-change-me-in-prod}"
  CELERY_BROKER_URL: "${CELERY_BROKER_URL:-redis://redis:6379/0}"
  CELERY_RESULT_BACKEND: "${CELERY_RESULT_BACKEND:-redis://redis:6379/1}"
  CELERY_DEFAULT_QUEUE: "${CELERY_DEFAULT_QUEUE:-default}"
  WEB_CONCURRENCY: "${WEB_CONCURRENCY:-4}"
  GUNICORN_TIMEOUT: "${GUNICORN_TIMEOUT:-120}"
  VIRUS_SCAN_ENABLED: "${VIRUS_SCAN_ENABLED:-false}"
  CLAMD_HOST: "${CLAMD_HOST:-clamav}"
  CLAMD_PORT: "3310"
  # On the server you use Supabase storage; default reflects that. Dev overrides
  # to `local` via .env / the dev overlay when needed.
  STORAGE_BACKEND: "${STORAGE_BACKEND:-supabase}"
  LOCAL_STORAGE_DIR: "/app/var/procurement-documents"
  MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-25}"

services:
  # ── LOCAL-DEV ONLY: bundled Postgres (profile: dev) ─────────────────────────
  db:
    image: postgres:16
    profiles: ["dev"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-factory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-factory}
      POSTGRES_DB: ${POSTGRES_DB:-factory}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-factory} -d ${POSTGRES_DB:-factory}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── LOCAL-DEV ONLY: bundled Redis (profile: dev) ────────────────────────────
  redis:
    image: redis:7-alpine
    profiles: ["dev"]
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ── ClamAV virus scanner — OPT-IN (profile: scan) ───────────────────────────
  clamav:
    image: clamav/clamav:latest
    profiles: ["scan"]
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${CLAMD_HOST_PORT:-3310}:3310"
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ── Backend API — Gunicorn managing uvicorn workers ─────────────────────────
  api:
    <<: *app-base
    command: ["api"]
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
      RUN_SEED: "${RUN_SEED:-false}"     # OFF by default — seed is manual
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  # ── Celery worker ───────────────────────────────────────────────────────────
  worker:
    <<: *app-base
    command: ["worker"]
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "false"
      RUN_SEED: "false"
      CELERY_CONCURRENCY: "${CELERY_CONCURRENCY:-4}"
      CELERY_LOGLEVEL: "${CELERY_LOGLEVEL:-info}"
    depends_on:
      api:
        condition: service_healthy

  # ── Celery beat ─────────────────────────────────────────────────────────────
  beat:
    <<: *app-base
    command: ["beat"]
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "false"
      RUN_SEED: "false"
      CELERY_LOGLEVEL: "${CELERY_LOGLEVEL:-info}"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
    name: ${COMPOSE_PROJECT_NAME:-factory}_pgdata
  redisdata:
    name: ${COMPOSE_PROJECT_NAME:-factory}_redis_data
  procurement_docs:
    name: ${COMPOSE_PROJECT_NAME:-factory}_procurement_docs