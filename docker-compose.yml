# ──────────────────────────────────────────────────────────────
# Leather Factory backend — docker-compose.yml
# ──────────────────────────────────────────────────────────────
#   docker compose up --build   → Postgres + Backend API (migrate + seed + uvicorn)
#   docker compose down         → stop, KEEP data (volume persists)
#   docker compose down -v      → stop AND wipe the DB (next `up` re-migrates + reseeds)
#
# The API talks to the bundled `db` service, NOT the Supabase URL in .env —
# the DATABASE_URL / ASYNC_DATABASE_URL below override .env on purpose (compose
# `environment:` wins over `env_file:`).
# ──────────────────────────────────────────────────────────────

services:
  # ────────────────────────────────────────────────────────────
  # Postgres 16 — primary data store
  # ────────────────────────────────────────────────────────────
  db:
    image: postgres:16
    container_name: factory_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-factory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-factory}
      POSTGRES_DB: ${POSTGRES_DB:-factory}
    ports:
      # Exposed on the host so devs can connect with psql/DBeaver.
      # Drop this in production — Docker-internal access only.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-factory} -d ${POSTGRES_DB:-factory}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ────────────────────────────────────────────────────────────
  # ClamAV — virus scanner sidecar (Stage-1 upload gate, §7)
  # The API streams uploads to clamd over INSTREAM at clamav:3310. In dev you can
  # skip this entirely with VIRUS_SCAN_ENABLED=false (uploads record scan_status
  # =skipped). ON in staging/prod: a malware hit is rejected (422) and the API
  # fails CLOSED (503) if clamd is unreachable — an unscanned file is never stored.
  # ────────────────────────────────────────────────────────────
  clamav:
    image: clamav/clamav:latest
    container_name: factory_clamav
    restart: unless-stopped
    ports:
      - "${CLAMD_HOST_PORT:-3310}:3310"
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s   # first boot downloads virus definitions (freshclam)

  # ────────────────────────────────────────────────────────────
  # Backend API — FastAPI / uvicorn
  # entrypoint.sh runs: wait-for-db → migrate → seed → uvicorn
  # ────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: factory_api
    restart: unless-stopped
    command: ["api"]
    # Pull non-DB config (SECRET_KEY, CHAT_MODEL, GROQ_API_KEY, rate-limit knobs)
    # from .env, then override the DB URLs to point at the compose `db` service.
    env_file:
      - .env
    environment:
      # Sync URL (Alembic + seed) and async URL (live API), both at the `db` host.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-factory}:${POSTGRES_PASSWORD:-factory}@db:5432/${POSTGRES_DB:-factory}
      ASYNC_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-factory}:${POSTGRES_PASSWORD:-factory}@db:5432/${POSTGRES_DB:-factory}
      DEBUG: "true"
      RUN_MIGRATIONS: "true"
      RUN_SEED: "true"
      UVICORN_RELOAD: "true"   # hot-reload in dev; remove for a production-like run
      # Stage-1 upload gate: scan via the clamav sidecar. Flip VIRUS_SCAN_ENABLED
      # to "false" to skip scanning when clamav isn't running (dev).
      VIRUS_SCAN_ENABLED: "${VIRUS_SCAN_ENABLED:-true}"
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
      # Storage stays on the local driver inside the container by default; set
      # STORAGE_BACKEND=supabase + the SUPABASE_* vars in prod (see .env.example).
      STORAGE_BACKEND: "${STORAGE_BACKEND:-local}"
      LOCAL_STORAGE_DIR: "/app/var/procurement-documents"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-25}"
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      clamav:
        condition: service_started
    volumes:
      # Bind-mount the source for hot-reload during dev.
      # COMMENT THIS OUT to test the baked image as it ships.
      - ./:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s   # first boot runs migrations + seed

volumes:
  pgdata:
    name: factory_pgdata
